baseURL = 'https://nshkr.space/'
languageCode = 'en-us'
title = 'North Shore Hackerspace'
enableRobotsTXT = true

[taxonomies]

[params]
  shortName    = 'NSHkr'
  tagline      = 'Where technology meets the waves'
  description  = 'A genuine hackerspace on the North Shore of Oahu. A dedicated room in Waialua, next to Haleiwa Town. Open daily 9AM-6PM. Day, weekly, and monthly passes available.'
  founded      = 'March 5, 2023'
  foundedISO   = '2023-03-05'
  status       = 'Active'
  members      = '2'
  roomSize     = '18 ft x 24 ft'
  city         = 'Waialua'
  nearby       = 'Haleiwa Town'
  region       = 'Hawaii'
  regionCode   = 'HI'
  country      = 'United States of America'
  latitude     = '21.573167'
  longitude    = '-158.122837'
  email        = 'Hello@NSHkr.Space'
  wiki         = 'https://wiki.hackerspaces.org/NSHkr'

[params.hours]
  open     = '9:00 AM'
  close    = '6:00 PM'
  days     = 'Daily'
  openISO  = '09:00'
  closeISO = '18:00'
  note     = 'Outside these hours by arrangement — just email us.'

[[params.passes]]
  name     = 'Daily'
  price    = '$30'
  unit     = '/ day'
  note     = 'Visitor rate'
  detail   = '$20 / day for Ohana — North Shore locals and returning friends.'
  featured = false

[[params.passes]]
  name     = 'One Day a Week'
  price    = '$60'
  unit     = '/ month'
  note     = 'One day a week'
  detail   = 'One day a week, every week. Good for a standing project session.'
  featured = false

[[params.passes]]
  name     = 'Monthly'
  price    = '$220'
  unit     = '/ month'
  note     = 'Two-month minimum'
  detail   = 'The best rate for sustained work. A single month with no commitment is $300.'
  featured = true

[[params.equipment]]
  name = 'Soldering Iron'
  desc = 'A proper bench for electronics work, repairs, and prototyping.'
  icon = 'soldering-iron'

[[params.equipment]]
  name = 'Amateur Radio Station'
  desc = 'Bring your callsign — or come get curious about getting one.'
  icon = 'radio'

[[params.values]]
  title = 'Create'
  icon  = 'code'
  body  = 'Bring the half-finished thing. Firmware that will not flash, a board that needs reflowing, a model that will not converge. Bench space, quiet, and room to think it through.'

[[params.values]]
  title = 'Connect'
  icon  = 'circuit'
  body  = 'Makers, developers, radio operators, and tinkerers who actually live and work out here. Small enough that you will know everyone — which is the point.'

[[params.values]]
  title = 'Balance'
  icon  = 'surf'
  body  = 'Island hours, kept on purpose. Get deep into something hard in the morning and still make the water before the light goes.'

[markup.goldmark.renderer]
  unsafe = true

# Cloudflare proxies this domain and rewrites mailto links into its
# "[email protected]" placeholder, which only decodes if its script runs.
# The <!--email_off--> directive opts out, so comments must survive minifying.
[minify]
  [minify.tdewolff.html]
    keepComments = true
